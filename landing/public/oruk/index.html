<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your oruk demo</title>
<style>
:root{--bg:#0f1412;--ink:#e6ede9;--muted:#93a39b;--line:#26312c;--accent:#4fd19c;--surface:#17201c;--surface2:#1f2a25}
:root:not([data-theme="dark"]) { }
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:28rem;margin:0 auto;padding:2.2rem 1.25rem 4rem;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:1.4rem}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600}.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:.4rem}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1.05;margin:.6rem 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;line-height:1.5}
.field{position:relative}
input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;display:none;max-height:16rem;overflow-y:auto}
.list.on{display:block}.list button{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;padding:.7rem 1rem;border:0;background:none;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.list button:first-child{border-top:0}.list button:hover,.list button:focus-visible{background:var(--surface2);outline:none}.list button span{color:var(--muted);font-size:.78rem}
.list .none{padding:.8rem 1rem;color:var(--muted);font-size:.9rem}
#result{display:none;flex-direction:column;gap:1rem}#result.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem}
.card .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rh{display:flex;align-items:center;gap:.7rem;margin-top:.3rem}
.rh img{width:44px;height:44px;border-radius:10px;background:#fff;object-fit:contain;padding:5px;box-sizing:border-box;flex:none}
.card h2{margin:0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:1.7rem}
.card p{margin:.4rem 0 0;color:var(--muted);font-size:.9rem;line-height:1.45}
video{width:100%;border-radius:18px;background:#000;display:block;aspect-ratio:9/16}
@media (orientation: landscape) and (min-width: 700px){ main{max-width:64rem} video{aspect-ratio:16/9} }
.cta{display:flex;flex-direction:column;gap:.6rem}
.btn{display:block;text-align:center;text-decoration:none;font-weight:600;padding:.9rem 1rem;border-radius:12px;background:var(--accent);color:#06281c}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.78rem;color:var(--muted);line-height:1.45;margin:0}
.capture{display:none;gap:.6rem}.capture.on{display:flex}.capture input{flex:1}
</style>
</head>
<body>
<main>
<div class="brand"><span><i></i><b>oruk</b> · at AI Faire</span><span>made by driftwood</span></div>
<div><h1>See oruk hear your customers.</h1><p class="sub">Type your company. We made a 30-second demo of oruk running on it.</p></div>
<div class="field"><input id="q" type="text" placeholder="Your company" autocomplete="off" autocapitalize="words" aria-label="Your company"><div class="list" id="list"></div></div>
<div id="result">
  <div class="card"><span class="k" id="rk">Your demo</span><div class="rh"><img id="rlogo" alt="" style="display:none"><h2 id="rn"></h2></div><p id="rp"></p></div>
  <video id="v" controls playsinline preload="metadata"></video>
  <div class="cta"><a class="btn" href="https://oruk.ai/waitlist">Try oruk</a><a class="btn ghost" href="mailto:nathan@oruk.ai?subject=oruk%20demo">Talk to Nathan</a></div>
  <div class="capture" id="cap"><input id="em" type="email" placeholder="Email for your company’s demo"><a class="btn" href="#" id="capSend">Send</a></div>
  <p class="note">Emotion and speaking-style scores in the film are measured by oruk-resonance on the recording. </p>
</div>
</main>
<script src="/oruk/app.js" defer></script>
</body>
</html>
