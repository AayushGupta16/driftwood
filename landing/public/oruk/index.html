<title>Your oruk demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap">
<style>
:root{--bg:#0f1412;--ink:#e6ede9;--muted:#93a39b;--line:#26312c;--accent:#4fd19c;--surface:#17201c;--surface2:#1f2a25}
:root:not([data-theme="dark"]) { }
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:28rem;margin:0 auto;padding:2.2rem 1.25rem 4rem;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:1.4rem}
.brand{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600}.brand i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:.4rem}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:2.4rem;line-height:1.05;margin:.6rem 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;line-height:1.5}
.field{position:relative}
input{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;display:none;max-height:16rem;overflow-y:auto}
.list.on{display:block}.list button{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;padding:.7rem 1rem;border:0;background:none;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.list button:first-child{border-top:0}.list button:hover,.list button:focus-visible{background:var(--surface2);outline:none}.list button span{color:var(--muted);font-size:.78rem}
.list .none{padding:.8rem 1rem;color:var(--muted);font-size:.9rem}
#result{display:none;flex-direction:column;gap:1rem}#result.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem}
.card .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h2{margin:.2rem 0 0;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:1.7rem}
.card p{margin:.4rem 0 0;color:var(--muted);font-size:.9rem;line-height:1.45}
video{width:100%;border-radius:18px;background:#000;display:block;aspect-ratio:9/16}
@media (orientation: landscape) and (min-width: 700px){ main{max-width:64rem} video{aspect-ratio:16/9} }
.cta{display:flex;flex-direction:column;gap:.6rem}
.btn{display:block;text-align:center;text-decoration:none;font-weight:600;padding:.9rem 1rem;border-radius:12px;background:var(--accent);color:#06281c}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.78rem;color:var(--muted);line-height:1.45;margin:0}
.capture{display:none;gap:.6rem}.capture.on{display:flex}.capture input{flex:1}
</style>
</head>

<main>

</div>
</main>

const BASE = "https://storage.googleapis.com/driftwood-oruk-faire";
const portrait = () => window.matchMedia('(orientation: portrait)').matches || window.innerWidth < 700;
function srcFor(c){ return `${BASE}/${c.s}-oruk-${portrait() ? '9x16' : '16x9'}.mp4` }
const PLAN = {SUPPORT:"A support call about your product, scored after it ends.", VOICE_AGENT:"A customer talking to your agent, graded on how they sounded.", CONTENT:"A scene from your own library, oruk reading every line.", GENERIC:"oruk’s flagship demo, with your name on it."};
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
const q = document.getElementById('q'), list = document.getElementById('list'), res = document.getElementById('result');
function matches(v){ const n = norm(v); if(!n) return []; const rank = c => { const names = [c.n, ...c.a].map(norm); if (names.includes(n)) return 0; if (names.some(x => x.startsWith(n))) return 1; return names.some(x => x.includes(n)) ? 2 : 9 }; return C.map(c => [rank(c), c]).filter(([r]) => r < 9).sort((a, b) => a[0] - b[0] || a[1].n.length - b[1].n.length).slice(0, 8).map(([, c]) => c) }
let current = null;
function pick(c){ current = c; q.value = c.n; list.classList.remove('on'); const v = document.getElementById('v'); v.src = srcFor(c); v.load(); document.getElementById('rn').textContent = c.n; document.getElementById('rp').textContent = PLAN[c.plan] + (c.product ? " (" + c.product + ")" : ""); document.getElementById('rk').textContent = "Your demo"; document.getElementById('cap').classList.remove('on'); res.classList.add('on'); res.scrollIntoView({behavior:'smooth',block:'start'}) }
function notListed(){ current = null; list.classList.remove('on'); const v = document.getElementById('v'); v.src = `${BASE}/a16z-oruk-${portrait() ? '9x16' : '16x9'}.mp4`; v.load(); document.getElementById('rn').textContent = q.value.trim(); document.getElementById('rp').textContent = "We don’t have yours yet. Watch how it works, and leave an email and we’ll make one for " + q.value.trim() + "."; document.getElementById('rk').textContent = "Not on our list yet"; document.getElementById('cap').classList.add('on'); res.classList.add('on') }
q.addEventListener('input', () => { const m = matches(q.value); list.innerHTML = m.map(c => `<button type="button" data-n="${c.n.replace(/"/g,'&quot;')}">${c.n}<span>${c.plan==='GENERIC'?'':c.plan.toLowerCase().replace('_',' ')}</span></button>`).join('') + (q.value.trim() ? `<button type="button" data-none="1">“${q.value.trim()}” isn’t listed — make mine<span>→</span></button>` : ''); list.classList.toggle('on', !!q.value.trim()) });
list.addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; if(b.dataset.none) return notListed(); pick(C.find(c => c.n === b.dataset.n)) });
