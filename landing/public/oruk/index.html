<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b100e">
<title>Your oruk demo</title>
<link rel="icon" href="/oruk/oruk-mark.png">
<style>
:root{--bg:#0b100e;--bg2:#101715;--ink:#eef4f0;--muted:#8fa197;--line:#233029;--accent:#4fd19c;--accent2:#2bb37f;--surface:#141c18;--surface2:#1b2620;--glow:rgba(79,209,156,.16)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:radial-gradient(60rem 30rem at 50% -8rem,var(--glow),transparent 60%),var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",Inter,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:64rem;display:flex;align-items:center;justify-content:space-between;padding:calc(.9rem + env(safe-area-inset-top)) 1.25rem .5rem}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.logo img{width:30px;height:auto;display:block}
.made{font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.38rem .75rem;white-space:nowrap}
.made b{color:var(--ink);font-weight:600}
main{width:100%;max-width:28rem;margin:0 auto;padding:1.2rem 1.25rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1.4rem;text-align:center;flex:1}
.hero{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding-top:1.2rem}
.hero .mark{width:88px;height:auto;filter:drop-shadow(0 12px 32px rgba(79,209,156,.35))}
h1{font-weight:700;font-size:2.15rem;line-height:1.08;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 b{color:var(--accent);font-weight:700}
.sub{color:var(--muted);margin:0;line-height:1.5;font-size:1.02rem;max-width:22rem;text-wrap:balance}
.field{position:relative;width:100%}
input{width:100%;font:inherit;font-size:1.12rem;padding:1rem 1.1rem 1rem 3rem;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.35)}
input::placeholder{color:#6f8078}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.field::before{content:"";position:absolute;left:1.05rem;top:50%;width:1.05rem;height:1.05rem;transform:translateY(-55%);border:2px solid var(--muted);border-radius:50%;box-sizing:border-box;pointer-events:none}
.field::after{content:"";position:absolute;left:1.85rem;top:50%;width:.5rem;height:2px;background:var(--muted);transform:translateY(.32rem) rotate(45deg);pointer-events:none}
.list{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;z-index:5;display:none;max-height:17rem;overflow-y:auto;box-shadow:0 18px 44px rgba(0,0,0,.5);text-align:left}
.list.on{display:block}.list button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-size:1rem;padding:.8rem 1.05rem;border:0;background:none;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.list button:first-child{border-top:0}.list button:hover,.list button:focus-visible{background:var(--surface2);outline:none}.list button span{color:var(--muted);font-size:.74rem;letter-spacing:.04em}
.list .none{padding:.9rem 1.05rem;color:var(--muted);font-size:.92rem}
#result{display:none;flex-direction:column;gap:1rem;width:100%}#result.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.05rem 1.15rem;text-align:left}
.card .k{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.rh{display:flex;align-items:center;gap:.8rem;margin-top:.45rem}
.rh img{width:46px;height:46px;border-radius:12px;background:#fff;object-fit:contain;padding:6px;flex:none}
.card h2{margin:0;font-weight:700;font-size:1.45rem;letter-spacing:-.02em}
.card p{margin:.45rem 0 0;color:var(--muted);font-size:.9rem;line-height:1.45}
.frame{border-radius:22px;padding:6px;background:linear-gradient(160deg,rgba(79,209,156,.45),rgba(79,209,156,.05));box-shadow:0 24px 60px rgba(0,0,0,.5)}
video{width:100%;border-radius:17px;background:#000;display:block;aspect-ratio:9/16}
.cta{display:flex;flex-direction:column;gap:.6rem;width:100%}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;padding:1rem;border-radius:14px;background:var(--accent);color:#06281c;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.76rem;color:var(--muted);line-height:1.45;margin:0}
.capture{display:none;gap:.6rem;width:100%}.capture.on{display:flex}.capture input{flex:1;padding-left:1rem}.capture .field::before,.capture .field::after{display:none}
footer{width:100%;max-width:28rem;padding:0 1.25rem calc(1.4rem + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:1.2rem;font-size:.74rem;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--ink)}
@media (orientation: landscape) and (min-width: 700px){
  main{max-width:64rem;gap:1.6rem;padding-top:1.6rem}
  .hero .mark{width:104px}
  h1{font-size:3rem}.sub{font-size:1.1rem;max-width:30rem}
  .field{max-width:32rem}
  #result{max-width:56rem;margin:0 auto}
  video{aspect-ratio:16/9}
  .cta{flex-direction:row}.cta .btn{flex:1}
}
@media (prefers-reduced-motion: no-preference){ .hero .mark{animation:float 5s ease-in-out infinite} @keyframes float{50%{transform:translateY(-5px)}} }
</style>
</head>
<body>
<header>
  <a class="logo" href="https://oruk.ai"><img src="/oruk/oruk-mark.png" alt="">oruk</a>
  <span class="made">made by <b>driftwood</b></span>
</header>
<main>
  <div class="hero">
    <img class="mark" src="/oruk/oruk-mark.png" alt="oruk">
    <h1>See oruk <b>hear</b> your customers.</h1>
    <p class="sub">Type your company. We made a demo of oruk running on a call with your customer.</p>
  </div>
  <div class="field"><input id="q" type="text" placeholder="Your company" autocomplete="off" autocapitalize="words" aria-label="Your company" enterkeyhint="search"><div class="list" id="list"></div></div>
  <div id="result">
    <div class="card"><span class="k" id="rk">Your demo</span><div class="rh"><img id="rlogo" alt="" style="display:none"><h2 id="rn"></h2></div><p id="rp"></p></div>
    <div class="frame"><video id="v" controls playsinline preload="metadata"></video></div>
    <div class="cta"><a class="btn" href="https://oruk.ai/waitlist">Try oruk</a><a class="btn ghost" href="mailto:nathan@oruk.ai?subject=oruk%20demo">Talk to Nathan</a></div>
    <div class="capture" id="cap"><input id="em" type="email" placeholder="Email for your company’s demo"><a class="btn" href="#" id="capSend">Send</a></div>
    <p class="note">Emotion and speaking-style scores in the film are measured by oruk-resonance on the recording.</p>
  </div>
</main>
<footer><a href="https://oruk.ai">oruk.ai</a><span>·</span><a href="https://driftwood.sh">driftwood.sh</a></footer>
<script src="/oruk/app.js" defer></script>
</body>
</html>
